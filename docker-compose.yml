version: '3.8'

services:
  timetrace:
    build: .
    container_name: timetrace
    ports:
      - "3000:3000"
      - "8000:8000"
    volumes:
      - ./backend/src/data:/app/data
      - ./.env:/app/.env:ro  # 挂载宿主机的.env文件(只读)
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/app/data
    restart: unless-stopped