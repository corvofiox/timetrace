version: '3.8'

services:
  timetrace:
    build: .
    container_name: timetrace
    ports:
      - "8192:8192"
    volumes:
      - ./backend/src/data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=8192
      - DATA_DIR=/app/data
      - DB_TYPE=sqlite
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET:-change-me-in-production}
    restart: unless-stopped
