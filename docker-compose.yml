version: '3.8'

services:
  timetrace:
    build: .
    container_name: timetrace
    ports:
      - "8000:8000"
    volumes:
      - ./backend/src/data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=8000
      - DATA_DIR=/app/data
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET:-change-me-in-production}
    restart: unless-stopped
