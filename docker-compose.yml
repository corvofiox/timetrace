version: '3.8'

services:
  timetrace:
    build: .
    container_name: timetrace
    ports:
      - "3000:3000"
      - "8000:8000"
    volumes:
      - ./backend/src/data:/app/data  # 挂载数据目录(包含.env文件)
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/app/data
    restart: unless-stopped