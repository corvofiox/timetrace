version: '3.8'

services:
  timetrace-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"  # 后端API端口
      - "8000:8000"  # 前端服务端口
    volumes:
      - ./data:/app/data  # 持久化数据存储
    environment:
      - NODE_ENV=production
      - PORT=3000
      # JWT配置（可选，如果不提供将自动生成）
      - JWT_SECRET=${JWT_SECRET:-}
      - JWT_EXPIRE=${JWT_EXPIRE:-15m}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET:-}
      - REFRESH_TOKEN_EXPIRE=${REFRESH_TOKEN_EXPIRE:-7d}
      # 数据存储目录
      - DATA_DIR=/app/data
    restart: unless-stopped
    container_name: timetrace-app